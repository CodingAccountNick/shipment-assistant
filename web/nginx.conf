server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the .NET API container (by its Compose service name)
    location /api/ {
        proxy_pass http://shipments-api:8080;
        proxy_read_timeout 120s;   # AI answers can take a while
    }

    # Everything else: the Angular app. Unknown paths fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}