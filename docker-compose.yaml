services:
  ai-service:
    build: ./ai-service
    ports:
      - "8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  shipments-api:
    build: ./src/Shipments.Api
    ports:
      - "5108:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AiService__BaseUrl: http://ai-service:8001
      ConnectionStrings__Shipments: Host=db;Port=5432;Database=shipments;Username=shipments;Password=${POSTGRES_PASSWORD:-devpassword}
    depends_on:
      - ai-service
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: shipments
      POSTGRES_USER: shipments
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipments -d shipments"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data: