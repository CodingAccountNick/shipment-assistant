services:
  ai-service:
    build: ./ai-service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://shipments:${POSTGRES_PASSWORD:-devpassword}@db:5432/shipments
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  shipments-api:
    build: ./src/Shipments.Api
    ports:
      - "5108:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      AiService__BaseUrl: http://ai-service:8001
      ConnectionStrings__Shipments: Host=db;Port=5432;Database=shipments;Username=shipments;Password=${POSTGRES_PASSWORD:-devpassword}
      RabbitMq__HostName: rabbitmq
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-devpassword}
    depends_on:
      ai-service:
        condition: service_started
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8080:80"
    depends_on:
      - shipments-api
    restart: unless-stopped
    
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: shipments
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-devpassword}
    ports:
      - "5672:5672"     # for the services
      - "15672:15672"   # web management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  notifications:
    build: ./src/Notifications.Worker
    environment:
      RabbitMq__HostName: rabbitmq
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-devpassword}
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: shipments
      POSTGRES_USER: shipments
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shipments -d shipments"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:

  